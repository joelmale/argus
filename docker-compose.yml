services:
  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: argus_db
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argus}
      POSTGRES_USER: ${POSTGRES_USER:-argus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${ARGUS_DB_BIND_HOST:-127.0.0.1}:${ARGUS_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: argus_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${ARGUS_REDIS_BIND_HOST:-127.0.0.1}:${ARGUS_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────────
  backend:
    image: ${ARGUS_BACKEND_IMAGE:-ghcr.io/joelmale/argus-backend:main}
    container_name: argus_backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+asyncpg://argus:change-me-db-password@db:5432/argus}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379/0}
      SCANNER_DEFAULT_TARGETS: ${SCANNER_DEFAULT_TARGETS:-192.168.1.0/24}
      SCANNER_INTERVAL_MINUTES: ${SCANNER_INTERVAL_MINUTES:-60}
      SCANNER_DEFAULT_PROFILE: ${SCANNER_DEFAULT_PROFILE:-balanced}
      SCANNER_PASSIVE_ARP: ${SCANNER_PASSIVE_ARP:-true}
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:-public}
      SNMP_VERSION: ${SNMP_VERSION:-2c}
      SNMP_TIMEOUT: ${SNMP_TIMEOUT:-5}
      SNMP_V3_USERNAME: ${SNMP_V3_USERNAME:-}
      SNMP_V3_AUTH_KEY: ${SNMP_V3_AUTH_KEY:-}
      SNMP_V3_PRIV_KEY: ${SNMP_V3_PRIV_KEY:-}
      SNMP_V3_AUTH_PROTOCOL: ${SNMP_V3_AUTH_PROTOCOL:-sha}
      SNMP_V3_PRIV_PROTOCOL: ${SNMP_V3_PRIV_PROTOCOL:-aes}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-240}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:3000"]}
      AI_BACKEND: ${AI_BACKEND:-ollama}
      AI_ENABLE_PER_SCAN: ${AI_ENABLE_PER_SCAN:-true}
      AI_MAX_CONCURRENT_HOSTS: ${AI_MAX_CONCURRENT_HOSTS:-1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      NOTIFY_WEBHOOK_TOKEN: ${NOTIFY_WEBHOOK_TOKEN:-}
      INSOC_URL: ${INSOC_URL:-}
      INSOC_API_TOKEN: ${INSOC_API_TOKEN:-}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-6}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
      APP_BASE_URL: ${APP_BASE_URL:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
    volumes:
      - argus_secrets:/run/secrets
    command: ["sh", "-c", "python scripts/migrate.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ARGUS_BACKEND_BIND_HOST:-0.0.0.0}:${ARGUS_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Scanner Worker ──────────────────────────────────────────
  scanner:
    image: ${ARGUS_SCANNER_IMAGE:-ghcr.io/joelmale/argus-scanner:main}
    container_name: argus_scanner
    restart: unless-stopped
    user: "0"
    network_mode: host
    env_file: .env.production
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      DATABASE_URL: ${SCANNER_DATABASE_URL:-postgresql+asyncpg://argus:change-me-db-password@127.0.0.1:5432/argus}
      REDIS_URL: ${SCANNER_REDIS_URL:-redis://127.0.0.1:6379/0}
      SCANNER_DEFAULT_TARGETS: ${SCANNER_DEFAULT_TARGETS:-192.168.1.0/24}
      SCANNER_INTERVAL_MINUTES: ${SCANNER_INTERVAL_MINUTES:-60}
      SCANNER_DEFAULT_PROFILE: ${SCANNER_DEFAULT_PROFILE:-balanced}
      SCANNER_PASSIVE_ARP: ${SCANNER_PASSIVE_ARP:-true}
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:-public}
      SNMP_VERSION: ${SNMP_VERSION:-2c}
      SNMP_TIMEOUT: ${SNMP_TIMEOUT:-5}
      SNMP_V3_USERNAME: ${SNMP_V3_USERNAME:-}
      SNMP_V3_AUTH_KEY: ${SNMP_V3_AUTH_KEY:-}
      SNMP_V3_PRIV_KEY: ${SNMP_V3_PRIV_KEY:-}
      SNMP_V3_AUTH_PROTOCOL: ${SNMP_V3_AUTH_PROTOCOL:-sha}
      SNMP_V3_PRIV_PROTOCOL: ${SNMP_V3_PRIV_PROTOCOL:-aes}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-240}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:3000"]}
      AI_BACKEND: ${AI_BACKEND:-ollama}
      AI_ENABLE_PER_SCAN: ${AI_ENABLE_PER_SCAN:-true}
      AI_MAX_CONCURRENT_HOSTS: ${AI_MAX_CONCURRENT_HOSTS:-1}
      AI_MAX_STEPS: ${AI_MAX_STEPS:-5}
      AI_REINVESTIGATE_DAYS: ${AI_REINVESTIGATE_DAYS:-7}
      AI_SKIP_NO_EVIDENCE: ${AI_SKIP_NO_EVIDENCE:-true}
      AI_DEFERRED: ${AI_DEFERRED:-true}
      AI_LOCAL_MODE: ${AI_LOCAL_MODE:-single_shot}
      AI_SINGLE_LOCAL_MODEL: ${AI_SINGLE_LOCAL_MODEL:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      # Alerts (new_device, devices_offline, ports_changed) fire from scan workers.
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_TOKEN: ${NOTIFY_WEBHOOK_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
    volumes:
      - argus_secrets:/run/secrets
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - NET_RAW
      - NET_ADMIN

  # ── Scanner Scheduler ───────────────────────────────────────
  scanner-beat:
    image: ${ARGUS_SCANNER_IMAGE:-ghcr.io/joelmale/argus-scanner:main}
    container_name: argus_scanner_beat
    restart: unless-stopped
    network_mode: host
    env_file: .env.production
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      DATABASE_URL: ${SCANNER_DATABASE_URL:-postgresql+asyncpg://argus:change-me-db-password@127.0.0.1:5432/argus}
      REDIS_URL: ${SCANNER_REDIS_URL:-redis://127.0.0.1:6379/0}
      SCANNER_DEFAULT_TARGETS: ${SCANNER_DEFAULT_TARGETS:-192.168.1.0/24}
      SCANNER_INTERVAL_MINUTES: ${SCANNER_INTERVAL_MINUTES:-60}
      SCANNER_DEFAULT_PROFILE: ${SCANNER_DEFAULT_PROFILE:-balanced}
      SCANNER_PASSIVE_ARP: ${SCANNER_PASSIVE_ARP:-true}
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:-public}
      SNMP_VERSION: ${SNMP_VERSION:-2c}
      SNMP_TIMEOUT: ${SNMP_TIMEOUT:-5}
      SNMP_V3_USERNAME: ${SNMP_V3_USERNAME:-}
      SNMP_V3_AUTH_KEY: ${SNMP_V3_AUTH_KEY:-}
      SNMP_V3_PRIV_KEY: ${SNMP_V3_PRIV_KEY:-}
      SNMP_V3_AUTH_PROTOCOL: ${SNMP_V3_AUTH_PROTOCOL:-sha}
      SNMP_V3_PRIV_PROTOCOL: ${SNMP_V3_PRIV_PROTOCOL:-aes}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-240}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:3000"]}
      AI_BACKEND: ${AI_BACKEND:-ollama}
      AI_ENABLE_PER_SCAN: ${AI_ENABLE_PER_SCAN:-true}
      AI_MAX_CONCURRENT_HOSTS: ${AI_MAX_CONCURRENT_HOSTS:-1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    volumes:
      - argus_secrets:/run/secrets
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["celery", "-A", "app.workers.tasks.celery_app", "beat", "--loglevel=info"]

  # ── AI Worker ───────────────────────────────────────────────
  # Drains the AI investigation queue one asset at a time, so model calls never hold a scan
  # worker and a local Ollama only ever sees one request from Argus.
  scanner-ai:
    image: ${ARGUS_SCANNER_IMAGE:-ghcr.io/joelmale/argus-scanner:main}
    container_name: argus_scanner_ai
    restart: unless-stopped
    network_mode: host
    env_file: .env.production
    environment:
      WORKER_ROLE: ai
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      DATABASE_URL: ${SCANNER_DATABASE_URL:-postgresql+asyncpg://argus:change-me-db-password@127.0.0.1:5432/argus}
      REDIS_URL: ${SCANNER_REDIS_URL:-redis://127.0.0.1:6379/0}
      AI_BACKEND: ${AI_BACKEND:-ollama}
      AI_MAX_STEPS: ${AI_MAX_STEPS:-5}
      AI_LOCAL_MODE: ${AI_LOCAL_MODE:-single_shot}
      AI_SINGLE_LOCAL_MODEL: ${AI_SINGLE_LOCAL_MODEL:-true}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-180}
      AI_QUEUE_MIN_INTERVAL_SECONDS: ${AI_QUEUE_MIN_INTERVAL_SECONDS:-20}
      AI_QUEUE_MAX_PER_HOUR: ${AI_QUEUE_MAX_PER_HOUR:-60}
      AI_BREAKER_FAILURES: ${AI_BREAKER_FAILURES:-3}
      AI_BREAKER_COOLDOWN_SECONDS: ${AI_BREAKER_COOLDOWN_SECONDS:-900}
      AI_SLOW_CALL_SECONDS: ${AI_SLOW_CALL_SECONDS:-120}
      AI_MODEL_SWAP_WAIT_SECONDS: ${AI_MODEL_SWAP_WAIT_SECONDS:-60}
      AI_MODEL_SWAP_LIMIT_PER_HOUR: ${AI_MODEL_SWAP_LIMIT_PER_HOUR:-6}
      AI_MIN_GPU_FRACTION: ${AI_MIN_GPU_FRACTION:-0.5}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    volumes:
      - argus_secrets:/run/secrets
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["celery", "-A", "app.workers.tasks.celery_app", "worker", "-Q", "ai", "--concurrency", "1", "--hostname", "ai@%h", "--loglevel=info"]

  # ── Frontend ────────────────────────────────────────────────
  frontend:
    image: ${ARGUS_FRONTEND_IMAGE:-ghcr.io/joelmale/argus-frontend:main}
    container_name: argus_frontend
    restart: unless-stopped
    env_file: .env.production
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${ARGUS_FRONTEND_BIND_HOST:-0.0.0.0}:${ARGUS_FRONTEND_PORT:-3008}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', (r) => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  argus_secrets:
